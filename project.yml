name: Super
options:
  bundleIdPrefix: com.brianwang
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.4"
  # xcodegen 2.45.4 cannot model SPM-package test schemes via project.yml
  # (no `package/test-target` reference syntax). Per-package schemes are
  # hand-maintained in Scripts/xcodegen-extras/ and copied into place after
  # generation so `xcodebuild test -scheme <Package>` runs the iOS-runtime
  # snapshot tests in CI. Re-run via Scripts/generate-project.sh
  # (or in CI: `xcodegen generate && cp ...`).
  postGenCommand: cp Scripts/xcodegen-extras/Core.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Core.xcscheme && cp Scripts/xcodegen-extras/Chat.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Chat.xcscheme && cp Scripts/xcodegen-extras/Bible.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Bible.xcscheme && cp Scripts/xcodegen-extras/Todo.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Todo.xcscheme

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Core:
    path: Packages/Core
  Chat:
    path: Packages/Chat
  Bible:
    path: Packages/Bible
  Todo:
    path: Packages/Todo

targets:
  Super:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # configFiles wires Config/Base.xcconfig as the target's
    # baseConfigurationReference for both build configs. Base.xcconfig
    # does `#include? "Local.xcconfig"` so per-developer signing values
    # (DEVELOPMENT_TEAM, PROVISIONING_PROFILE_SPECIFIER) flow in from the
    # gitignored Local.xcconfig — never committed. CI's testflight
    # workflow writes Local.xcconfig from secrets before archiving.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
        # Per-module AGENTS.md / CLAUDE.md files under App/ live with the
        # source for contributor convenience but must not ship as runtime
        # resources in the production .app. The SuperBible target has the
        # mirror exclude on its own App-SuperBible block.
        excludes:
          - "**/*.md"
    info:
      path: App/Info.plist
      properties:
        # System launch screen rendered before SwiftUI mounts. Setting
        # UIColorName to `SplashBackground` (an asset colorset matching
        # `SuperTheme.light.background = #E8EDE4`) avoids a white flash
        # between Springboard and `SplashView`'s first frame.
        UILaunchScreen:
          UIColorName: SplashBackground
        # CFBundleDisplayName is the user-facing name on the home screen
        # and in iOS Settings. It diverges from the codebase identifier
        # (PRODUCT_NAME = "Super") because the App Store name "Super" is
        # already taken; the public brand is "SuperOS".
        CFBundleDisplayName: SuperOS
        # iPhone: portrait only. Chat-first UX assumes a vertical
        # composer + bubble layout; landscape would just letterbox.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad: all four orientations are required for multitasking;
        # App Store upload validation rejects builds that omit any.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSpeechRecognitionUsageDescription: "SuperOS uses speech recognition to dictate your chat messages on-device."
        NSMicrophoneUsageDescription: "SuperOS needs microphone access to capture your voice for dictation."
        # ATS exemptions: scoped to loopback only so local-LLM stacks
        # (Ollama, MLX, LM Studio, llama.cpp) can be reached over plain
        # HTTP. All other endpoints still go through ATS. The
        # `URLSecurity.isCleartextSafeForCredentials` helper is the
        # belt-and-suspenders gate so a misconfigured public-host model
        # entry can't leak its bearer token over cleartext.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianwang.Super
        PRODUCT_NAME: Super
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SUPPORTS_MACCATALYST: NO
      configs:
        # Release-only signing config is target-scoped (not project- or
        # command-line-scoped) so it doesn't leak into SwiftPM resource
        # bundles like GRDB_GRDB, which don't support provisioning
        # profiles. Per-developer values (DEVELOPMENT_TEAM,
        # PROVISIONING_PROFILE_SPECIFIER) come in via the xcconfig wired
        # by `configFiles:` above; standard Apple cert values stay inline
        # since they're public-equivalent.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - package: Core
      - package: Chat
      - package: Bible
      - package: Todo
  # Second App Store target. Shares Core, Chat, and Bible with SuperOS;
  # does NOT depend on Todo (per App-SuperBible/AGENTS.md § Module identity).
  # Plans / Memorize / Quiz / Learn are SuperBible-only and land in their
  # own packages at SB-M2+. SB-M0 wired the target; SB-M1 wires the real
  # composition root (Chat host + Bible) via the shared `App/Shell/*`
  # files included below. Full design:
  # docs/superpowers/specs/2026-05-23-superbible-fork-design.md.
  SuperBible:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App-SuperBible
        # Per-target AGENTS.md / CLAUDE.md / PRIVACY.md live alongside the
        # source for contributor convenience but are not runtime resources.
        # PRIVACY.md will be re-included as a bundled resource at SB-M4
        # when Settings → About → Privacy lands.
        # `SuperBibleSystemPrompt.md` IS bundled — see the explicit
        # `buildPhase: resources` entry further down.
        excludes:
          - "**/*.md"
      # Shared shell files compiled into both SuperOS and SuperBible
      # via project.yml file inclusion. `App/Shell/Placeholders/` is
      # deliberately NOT included — Recipes/Finance/etc. are SuperOS-only.
      # Keep this list narrow; any new `App/Shell/*.swift` must be added
      # explicitly here.
      - path: App/Shell/AppShell.swift
      - path: App/Shell/AppShellDependencies.swift
      - path: App/Shell/AppBootstrapHelpers.swift
      - path: App/Shell/FailureScreen.swift
      - path: App/Shell/FixedHamburgerButton.swift
      - path: App/Shell/LazyConversationDriver.swift
      # Bundled chat-briefing markdown. Excluded from the compile phase
      # by the `**/*.md` glob above; this entry re-adds it as a runtime
      # resource. `SuperBibleSystemPromptLoader` reads it via Bundle.main.
      - path: App-SuperBible/Resources/SuperBibleSystemPrompt.md
        buildPhase: resources
    info:
      path: App-SuperBible/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: SplashBackground
        CFBundleDisplayName: SuperBible
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSpeechRecognitionUsageDescription: "SuperBible uses speech recognition to dictate your chat messages on-device."
        NSMicrophoneUsageDescription: "SuperBible needs microphone access to capture your voice for dictation."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianwang.SuperBible
        PRODUCT_NAME: SuperBible
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App-SuperBible/Info.plist
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - package: Core
      - package: Chat
      - package: Bible
schemes:
  Super:
    build:
      targets:
        Super: all
    run:
      config: Debug
    archive:
      config: Release
  SuperBible:
    build:
      targets:
        SuperBible: all
    run:
      config: Debug
    archive:
      config: Release
