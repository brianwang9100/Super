name: Super
options:
  bundleIdPrefix: com.brianwang
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.4"
  # xcodegen 2.45.4 cannot model SPM-package test schemes via project.yml
  # (no `package/test-target` reference syntax). Chat.xcscheme is hand-
  # maintained in Scripts/xcodegen-extras/ and copied into place after
  # generation so `xcodebuild test -scheme Chat` runs the iOS-runtime
  # snapshot tests in CI. Re-run via Scripts/generate-project.sh
  # (or in CI: `xcodegen generate && cp ...`).
  postGenCommand: cp Scripts/xcodegen-extras/Chat.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Chat.xcscheme

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Core:
    path: Packages/Core
  Chat:
    path: Packages/Chat

targets:
  Super:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSSpeechRecognitionUsageDescription: "Super uses speech recognition to dictate your chat messages on-device."
        NSMicrophoneUsageDescription: "Super needs microphone access to capture your voice for dictation."
        # ATS exemptions: scoped to loopback only so local-LLM stacks
        # (Ollama, MLX, LM Studio, llama.cpp) can be reached over plain
        # HTTP. All other endpoints still go through ATS. The
        # `URLSecurity.isCleartextSafeForCredentials` helper is the
        # belt-and-suspenders gate so a misconfigured public-host model
        # entry can't leak its bearer token over cleartext.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianwang.Super
        PRODUCT_NAME: Super
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: Core
      - package: Chat
schemes:
  Super:
    build:
      targets:
        Super: all
    run:
      config: Debug
    archive:
      config: Release
