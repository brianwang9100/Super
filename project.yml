name: Super
options:
  bundleIdPrefix: com.brianwang
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.4"
  # XcodeGen cannot model package test schemes; copy the maintained schemes after generation.
  postGenCommand: cp Scripts/xcodegen-extras/Core.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Core.xcscheme && cp Scripts/xcodegen-extras/Chat.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Chat.xcscheme && cp Scripts/xcodegen-extras/Bible.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Bible.xcscheme && cp Scripts/xcodegen-extras/Todo.xcscheme Super.xcodeproj/xcshareddata/xcschemes/Todo.xcscheme

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Core:
    path: Packages/Core
  Chat:
    path: Packages/Chat
  Bible:
    path: Packages/Bible
  Todo:
    path: Packages/Todo

targets:
  Super:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # Load per-developer signing through the optional, ignored Local.xcconfig include.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App-SuperOS
        # Contributor guidance must not ship as runtime resources.
        excludes:
          - "**/*.md"
      # Keep shared shell files in both targets' explicit source lists.
      - path: App/Shell/AppShell.swift
      - path: App/Shell/AppShellDependencies.swift
      - path: App/Shell/AppShellLaunchBehavior.swift
      - path: App/Shell/AppBootstrapSupport.swift
      - path: App/Shell/FailureScreen.swift
      - path: App/Shell/FixedHamburgerButton.swift
      - path: App/Shell/LazyConversationDriver.swift
    info:
      path: App-SuperOS/Info.plist
      properties:
        # Both apps register super:// for shared Bible links. With both installed, iOS routes
        # to one app without a picker; per-target schemes remain a follow-up (BibleDeepLink.urlScheme).
        CFBundleURLTypes:
          - CFBundleURLName: com.brianwang.Super.deeplink
            CFBundleURLSchemes:
              - super
        # Match SplashView's background to avoid a white flash before SwiftUI mounts.
        UILaunchScreen:
          UIColorName: SplashBackground
        # The user-facing SuperOS brand differs from the internal Super product name.
        CFBundleDisplayName: SuperOS
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # All four iPad orientations are required for multitasking validation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSpeechRecognitionUsageDescription: "SuperOS uses speech recognition to dictate your chat messages on-device."
        NSMicrophoneUsageDescription: "SuperOS needs microphone access to capture your voice for dictation."
        # Reference build settings so archive-time version overrides reach Info.plist;
        # XcodeGen literals would otherwise leave every upload with the same build number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Standard HTTPS/Keychain encryption only; skips repeated export-compliance prompts.
        ITSAppUsesNonExemptEncryption: false
        # Allow local models over loopback HTTP only. URLSecurity separately prevents
        # credentials from being sent to unsafe cleartext hosts.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianwang.Super
        PRODUCT_NAME: Super
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App-SuperOS/Info.plist
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
      configs:
        # Keep signing target-scoped; SwiftPM resource bundles cannot accept provisioning profiles.
        # Private team/profile values come from Local.xcconfig.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - package: Core
      - package: Chat
      - package: Bible
      - package: Todo
  # SuperBible shares Core, Chat, and Bible; SuperOS-only applets stay out of this target.
  SuperBible:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App-SuperBible
        # Exclude contributor/privacy documents; explicitly bundle the persona resources below.
        excludes:
          - "**/*.md"
      # Keep shared shell files in both targets' explicit source lists; placeholders stay SuperOS-only.
      - path: App/Shell/AppShell.swift
      - path: App/Shell/AppShellDependencies.swift
      - path: App/Shell/AppShellLaunchBehavior.swift
      - path: App/Shell/AppBootstrapSupport.swift
      - path: App/Shell/FailureScreen.swift
      - path: App/Shell/FixedHamburgerButton.swift
      - path: App/Shell/LazyConversationDriver.swift
      # Re-add only the persona Markdown excluded above; the loader reads it from Bundle.main.
      - path: App-SuperBible/Resources/SuperBibleSystemPrompt.md
        buildPhase: resources
      - path: App-SuperBible/Resources/SuperBibleSystemPrompt.compact.md
        buildPhase: resources
    info:
      path: App-SuperBible/Info.plist
      properties:
        # Shares the SuperOS URL scheme; see the dual-install routing caveat above.
        CFBundleURLTypes:
          - CFBundleURLName: com.brianwang.SuperBible.deeplink
            CFBundleURLSchemes:
              - super
        # Match the SwiftUI splash: a transparent centered star over the same cream field.
        # Ignore safe-area insets so the background reaches every screen edge.
        UILaunchScreen:
          UIColorName: SplashBackground
          UIImageName: LaunchImage
          UIImageRespectsSafeAreaInsets: false
        CFBundleDisplayName: SuperBible
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSpeechRecognitionUsageDescription: "SuperBible uses speech recognition to dictate your chat messages on-device."
        NSMicrophoneUsageDescription: "SuperBible needs microphone access to capture your voice for dictation."
        # Use build-setting references so archive-time version overrides reach Info.plist.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # The permitted identifier must match BulkAnnotationBackgroundScheduler.taskIdentifier.
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.brianwang.SuperBible.bulk-annotation
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianwang.SuperBible
        PRODUCT_NAME: SuperBible
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App-SuperBible/Info.plist
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - package: Core
      - package: Chat
      - package: Bible
schemes:
  Super:
    build:
      targets:
        Super: all
    run:
      config: Debug
    archive:
      config: Release
  SuperBible:
    build:
      targets:
        SuperBible: all
    run:
      config: Debug
    archive:
      config: Release
