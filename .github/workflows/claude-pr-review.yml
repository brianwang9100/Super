name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by anthropics/claude-code-action@v1 to fetch an OIDC token,
  # which it exchanges for the per-run GitHub credentials it uses to post
  # review comments. Without it the action retries 3x then fails with
  # "Could not fetch an OIDC token."
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check OAuth token presence
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not set; skipping AI review. Run \`claude setup-token\` locally and add the token as a repo secret to enable."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing a pull request for the Super iOS app
            (Swift 6, SwiftUI, GRDB, strict concurrency). The repository
            root has AGENTS.md / CLAUDE.md with the canonical rules. Read
            them and any module-level AGENTS.md before forming opinions.

            Focus on:
            - Correctness, especially around async/await, Sendable, and
              actor reentrancy.
            - Strict-concurrency compliance (no Combine for data flow,
              no DispatchQueue/NSLock for synchronization).
            - GRDB usage: naming conventions, migrations, in-memory
              testability.
            - SwiftUI view models: @Observable @MainActor final class,
              protocol-typed dependencies, no static singletons.
            - Test coverage per AGENTS.md §Testing — every new code path
              ships with a test, every new SwiftUI view ships with a
              snapshot test.
            - Security: keychain accessibility, file protection, ATS
              cleartext suppression of bearer tokens.
            - Architecture: no cross-applet imports, event-bus for
              cross-applet communication.

            Post inline review comments only on lines you have a concrete
            concern about. End with a short summary recommendation:
            APPROVE, COMMENT, or REQUEST_CHANGES. Be terse — link to the
            specific rule in AGENTS.md when citing one.
          # Explicitly allowlist the GitHub MCP tools the reviewer needs to
          # post inline comments and a summary review. Without these the
          # action auto-detects "agent" mode (since the trigger is a generic
          # pull_request event) and Claude's tool calls to post comments are
          # denied — visible in the run log as "permission_denials_count".
          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-6
            --allowedTools mcp__github_inline_comment__create_inline_comment,mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__add_issue_comment
          # Surface Claude's actual messages in the workflow log so we can
          # tell whether a missing review is "Claude found nothing to flag"
          # vs "Claude tried but a tool was denied or rate-limited."
          show_full_output: true
