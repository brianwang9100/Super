name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by anthropics/claude-code-action@v1 to fetch an OIDC token,
  # which it exchanges for the per-run GitHub credentials it uses to post
  # review comments. Without it the action retries 3x then fails with
  # "Could not fetch an OIDC token."
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check OAuth token presence
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not set; skipping AI review. Run \`claude setup-token\` locally and add the token as a repo secret to enable."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Steps:
            1. Run `gh pr view ${{ github.event.pull_request.number }}` to read the title, description, and metadata.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the full diff.
            3. Use Read on AGENTS.md (and any module-level AGENTS.md the diff touches) for project-specific rules.

            This is the Super iOS app: Swift 6 strict concurrency, SwiftUI,
            GRDB persistence, applet-based architecture.

            Focus on:
            - Correctness, especially around async/await, Sendable, and
              actor reentrancy.
            - Strict-concurrency compliance (no Combine for data flow,
              no DispatchQueue/NSLock for synchronization).
            - GRDB usage: naming conventions, migrations, in-memory
              testability.
            - SwiftUI view models: @Observable @MainActor final class,
              protocol-typed dependencies, no static singletons.
            - Test coverage per AGENTS.md §Testing — every new code path
              ships with a test, every new SwiftUI view ships with a
              snapshot test.
            - Security: keychain accessibility, file protection, ATS
              cleartext suppression of bearer tokens.
            - Architecture: no cross-applet imports, event-bus for
              cross-applet communication.

            Posting the review:
            - For specific concerns on specific lines: use the
              mcp__github_inline_comment__create_inline_comment tool.
            - End with a single summary comment via
              mcp__github__add_issue_comment containing one of:
              APPROVE / COMMENT / REQUEST_CHANGES, plus a 2-3 sentence
              rationale. Link to the specific AGENTS.md rule when
              citing one. Be terse.
          # The action auto-detects "agent" mode for generic pull_request
          # events, which doesn't pre-allowlist any tools. We have to spell
          # out everything Claude needs:
          #   - Read: read AGENTS.md and source files
          #   - Bash(gh ...): read PR metadata + diff
          #   - mcp__github_inline_comment__*: post inline comments
          #   - mcp__github__add_issue_comment: post the summary verdict
          claude_args: |
            --max-turns 30
            --model claude-sonnet-4-6
            --allowedTools "Read,Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment,mcp__github__add_issue_comment"
          # Surface Claude's actual messages in the workflow log so we can
          # tell whether a missing review is "Claude found nothing to flag"
          # vs "Claude tried but a tool was denied or rate-limited."
          show_full_output: true
