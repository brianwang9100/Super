name: SwiftLint

on:
  push:
    branches: [main]
  # No path filter on purpose: SwiftLint is a required status check,
  # and a path-filtered required check that doesn't fire on a PR shows
  # as "expected but not reported" and blocks merge forever. SwiftLint
  # in a Docker container runs in ~30s, so always-on is cheap.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v7

      - name: Show SwiftLint version
        run: swiftlint version

      - name: Lint
        run: swiftlint lint --quiet --reporter github-actions-logging
