name: Swift Tests

on:
  push:
    branches: [main, codex/xcode-27-pcc]
  # No path filter on purpose: this workflow is a required status check,
  # and a path-filtered required check that doesn't fire on a PR shows
  # as "expected but not reported" and blocks merge forever. Cheap to
  # always run — `swift test` skips quickly when SwiftPM cache is warm.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_BUILD: "27A5252f"

jobs:
  changes:
    # Detects whether anything other than docs changed. A docs-only PR then
    # skips the macOS `test` legs, while the required-check gate (`swift-test`)
    # still runs and reports — preserving the "no path filter on the workflow"
    # property the top-of-file comment relies on. dot: true is on by default
    # in paths-filter@v3, so a .github/ or other dotfile change runs the
    # full matrix.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate coverage reporting
        run: python3 -m unittest discover -s Scripts/tests -p 'test_swift_coverage.py'
      # Third-party community action pinned to a commit SHA (not a mutable
      # tag) so a tag force-push can't swap the code under us.
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  discover:
    # Emits the package matrix by globbing `Packages/*/Package.swift`, so a
    # new SwiftPM package is tested with zero workflow edits. A GitHub
    # Actions matrix cannot be computed inline — it must come from a prior
    # job's output, hence this tiny job runs as a serial prefix.
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: Packages
      - id: find
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=$(for d in Packages/*/Package.swift; do
            basename "$(dirname "$d")"
          done | sort -u | jq -R . | jq -cs .)
          # Fail loud on an empty result: an empty matrix would skip every
          # `test` leg, and the gate could then read a vacuous success and
          # go green having tested nothing.
          if [ -z "$pkgs" ] || [ "$pkgs" = "[]" ]; then
            echo "::error::No SwiftPM packages found under Packages/*/Package.swift."
            exit 1
          fi
          echo "Discovered packages: $pkgs"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  test:
    # Gated on `changes`: docs-only PRs skip these macOS legs; the
    # `swift-test` gate below still reports success in that case.
    needs: [changes, discover]
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # Keep Swift 6 strict concurrency; assert the exact 27 beta build
        # before restoring any compiled SwiftPM cache.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0-beta"

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          ACTUAL_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')
          if [ "$ACTUAL_BUILD" != "$XCODE_BUILD" ]; then
            echo "::error::Expected Xcode build $XCODE_BUILD, got $ACTUAL_BUILD."
            exit 1
          fi

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: Packages/${{ matrix.package }}/.build
          # Exact build and architecture isolate compiled modules, even
          # between beta releases with the same Xcode version string.
          key: spm-${{ runner.os }}-${{ runner.arch }}-xc${{ env.XCODE_BUILD }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package)) }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xc${{ env.XCODE_BUILD }}-${{ matrix.package }}-

      - name: Run tests
        id: tests
        working-directory: Packages/${{ matrix.package }}
        # `-Xswiftc -warnings-as-errors` mirrors the Xcode targets'
        # SWIFT_TREAT_WARNINGS_AS_ERRORS (project.yml). The bare `swift test`
        # path compiles from Package.swift and ignores that build setting, so
        # the flag is applied here (CI-only) to keep both legs consistent
        # without forcing warnings-as-errors on local `swift test`.
        run: swift test --parallel --enable-code-coverage -Xswiftc -warnings-as-errors

      - name: Coverage summary
        # Missing coverage after successful tests is a reporting failure;
        # don't obscure a test/build failure with a second missing-file error.
        if: always() && steps.tests.outcome == 'success'
        working-directory: Packages/${{ matrix.package }}
        run: python3 ../../Scripts/swift_coverage.py --package .

  swift-test:
    # Aggregation gate. The `test` job above publishes one check per
    # discovered package (`test (Core)` …); this job re-exports a single
    # stable `swift-test` status that depends on every leg. Branch
    # protection requires `swift-test` alone, so adding a package never
    # needs a branch-protection edit. A required check that never reports
    # blocks merge forever — keep this job's name and trigger stable.
    needs: [changes, discover, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify discovery and all package test legs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # Fail closed if the `changes` detector didn't succeed: its empty
          # output must not be misread as "docs-only" and skip the tests.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes-detection job did not succeed — refusing to skip Swift tests."
            exit 1
          fi
          # `discover` runs on every PR (incl. docs-only). Check it BEFORE the
          # docs-only early-exit so a broken package-glob script blocks merge
          # promptly rather than hiding until the next code-change PR. A failed
          # discover skips the `test` matrix, which must not read as success.
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::Package discovery failed — no packages were tested."
            exit 1
          fi
          # Docs-only PR: the `test` matrix was intentionally skipped, so
          # this required check passes without running it.
          if [ "$CODE" != "true" ]; then
            echo "Docs-only change — no Swift tests required."
            exit 0
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::One or more swift-test matrix legs failed."
            exit 1
          fi
          echo "All swift-test matrix legs passed."
