name: Swift Tests

on:
  push:
    branches: [main]
  # Required checks must report on every PR; a workflow-level path filter can block merging.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip expensive jobs for docs-only changes while still reporting the required gate.
    # Dotfiles must count as code changes.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Third-party community action pinned to a commit SHA (not a mutable
      # tag) so a tag force-push can't swap the code under us.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  discover:
    # Discover package schemes before the matrix so adding a package needs no workflow edit.
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: Packages
      - id: find
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=$(for d in Packages/*/Package.swift; do
            basename "$(dirname "$d")"
          done | sort -u | jq -R . | jq -cs .)
          # Reject an empty matrix so running no tests cannot produce a successful gate.
          if [ -z "$pkgs" ] || [ "$pkgs" = "[]" ]; then
            echo "::error::No SwiftPM packages found under Packages/*/Package.swift."
            exit 1
          fi
          echo "Discovered packages: $pkgs"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  test:
    needs: [changes, discover]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode
        # Pin the toolchain so runner-image updates cannot silently change compiler behavior.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: Packages/${{ matrix.package }}/.build
          # Cache entries are immutable: include source inputs so rebuilt outputs get saved.
          # Keep architecture/toolchain boundaries in fallback keys.
          key: >-
            spm-v2-${{ runner.os }}-${{ runner.arch }}-xc26.4.1-${{ matrix.package }}-${{
              hashFiles(
                format('Packages/{0}/Package.swift', matrix.package),
                format('Packages/{0}/Package.resolved', matrix.package),
                format('Packages/{0}/Sources/**', matrix.package),
                format('Packages/{0}/Tests/**', matrix.package),
                'Packages/Core/Package.swift', 'Packages/Core/Package.resolved',
                'Packages/Core/Sources/**', '.github/workflows/swift-test.yml'
              )
            }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ runner.arch }}-xc26.4.1-${{ matrix.package }}-

      - name: Run tests
        working-directory: Packages/${{ matrix.package }}
        # SwiftPM ignores the Xcode warnings-as-errors setting, so pass it explicitly here.
        run: swift test --parallel --enable-code-coverage -Xswiftc -warnings-as-errors

      - name: Coverage summary
        if: always()
        working-directory: Packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          PROFDATA=$(find .build -name 'default.profdata' | head -1)
          BINARY_DIR=$(find .build -name "${PACKAGE}PackageTests.xctest" -type d | head -1)
          if [ -z "$PROFDATA" ] || [ -z "$BINARY_DIR" ]; then
            echo "No coverage artifacts found — skipping summary."
            exit 0
          fi
          BINARY="$BINARY_DIR/Contents/MacOS/${PACKAGE}PackageTests"
          xcrun llvm-cov report "$BINARY" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex='\.build/|/Tests/' \
            | tail -40

  swift-test:
    # Keep the required `swift-test` check stable as packages are added to the matrix.
    needs: [changes, discover, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify discovery and all package test legs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # Fail closed if change detection failed; empty output is not proof of a docs-only PR.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes-detection job did not succeed — refusing to skip Swift tests."
            exit 1
          fi
          # Check discovery even for docs-only changes; a failed discovery must not masquerade as a skipped matrix.
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::Package discovery failed — no packages were tested."
            exit 1
          fi
          if [ "$CODE" != "true" ]; then
            echo "Docs-only change — no Swift tests required."
            exit 0
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::One or more swift-test matrix legs failed."
            exit 1
          fi
          echo "All swift-test matrix legs passed."
