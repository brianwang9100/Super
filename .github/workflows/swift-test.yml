name: Swift Tests

on:
  push:
    branches: [main]
  # No path filter on purpose: this workflow is a required status check,
  # and a path-filtered required check that doesn't fire on a PR shows
  # as "expected but not reported" and blocks merge forever. Cheap to
  # always run — `swift test` skips quickly when SwiftPM cache is warm.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    # Emits the package matrix by globbing `Packages/*/Package.swift`, so a
    # new SwiftPM package is tested with zero workflow edits. A GitHub
    # Actions matrix cannot be computed inline — it must come from a prior
    # job's output, hence this tiny job runs as a serial prefix.
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: Packages
      - id: find
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=$(for d in Packages/*/Package.swift; do
            basename "$(dirname "$d")"
          done | sort -u | jq -R . | jq -cs .)
          # Fail loud on an empty result: an empty matrix would skip every
          # `test` leg, and the gate could then read a vacuous success and
          # go green having tested nothing.
          if [ -z "$pkgs" ] || [ "$pkgs" = "[]" ]; then
            echo "::error::No SwiftPM packages found under Packages/*/Package.swift."
            exit 1
          fi
          echo "Discovered packages: $pkgs"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # Repo runs Swift 6 strict concurrency; macos-26's Xcode 26.4.1
        # toolchain enforces it. Pinned literally rather than
        # `latest-stable` so a runner image refresh can't surprise us
        # with a beta toolchain (Xcode 26.5 is still preview on the
        # image as of writing).
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: Packages/${{ matrix.package }}/.build
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.resolved', matrix.package)) }}
          restore-keys: |
            spm-${{ runner.os }}-${{ matrix.package }}-

      - name: Run tests
        working-directory: Packages/${{ matrix.package }}
        run: swift test --parallel --enable-code-coverage

      - name: Coverage summary
        if: always()
        working-directory: Packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          PROFDATA=$(find .build -name 'default.profdata' | head -1)
          BINARY_DIR=$(find .build -name "${PACKAGE}PackageTests.xctest" -type d | head -1)
          if [ -z "$PROFDATA" ] || [ -z "$BINARY_DIR" ]; then
            echo "No coverage artifacts found — skipping summary."
            exit 0
          fi
          BINARY="$BINARY_DIR/Contents/MacOS/${PACKAGE}PackageTests"
          xcrun llvm-cov report "$BINARY" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex='\.build/|/Tests/' \
            | tail -40

  swift-test:
    # Aggregation gate. The `test` job above publishes one check per
    # discovered package (`test (Core)` …); this job re-exports a single
    # stable `swift-test` status that depends on every leg. Branch
    # protection requires `swift-test` alone, so adding a package never
    # needs a branch-protection edit. A required check that never reports
    # blocks merge forever — keep this job's name and trigger stable.
    needs: [discover, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify discovery and all package test legs passed
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # Check `discover` explicitly: if it failed, the `test` matrix is
          # skipped, and an empty/skipped matrix must not read as success.
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::Package discovery failed — no packages were tested."
            exit 1
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::One or more swift-test matrix legs failed."
            exit 1
          fi
          echo "All swift-test matrix legs passed."
