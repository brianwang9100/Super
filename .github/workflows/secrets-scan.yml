name: Secrets Scan

on:
  pull_request:
  push:
    branches: [main]
  # Weekly safety net: catches anything that slipped through the
  # PR/push gates (e.g., during the CI-bootstrap window when direct
  # pushes were unrestricted) and re-validates against the latest
  # gitleaks rule set.
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks scans full git history, so we need every commit —
          # the default shallow checkout (depth=1) would miss anything
          # introduced before HEAD.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        run: |
          # --redact: don't print secret values into public logs
          # --no-banner: keep output tight
          # exit code 1 = findings, 0 = clean, >1 = tool error
          gitleaks git --redact --no-banner --verbose .
