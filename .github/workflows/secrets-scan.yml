name: Secrets Scan

on:
  pull_request:
  push:
    branches: [main]
  # Rescan history weekly with the current rules, including changes outside the PR gates.
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required to catch secrets introduced before HEAD.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        run: |
          # Redact secret values; exit 1 means findings and >1 means a tool error.
          gitleaks git --redact --no-banner --verbose .
