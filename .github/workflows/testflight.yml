name: TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (CFBundleShortVersionString). Leave blank to use whatever is in Info.plist."
        required: false
        default: ""
  push:
    tags:
      - 'release/v*'

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
      APPLE_DIST_CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
      # Resolve from runtime HOME; Apple tools discover API keys in ~/.appstoreconnect/private_keys.
      AUTH_KEY_PATH: ""
      # Use a temporary keychain and delete it at job end to avoid retaining signing material.
      KEYCHAIN_PATH: ""
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        # Pin a release toolchain so runner-image updates cannot introduce a beta into uploads.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Set AUTH_KEY_PATH
        run: echo "AUTH_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Verify required secrets
        run: |
          missing=()
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -z "$APP_STORE_CONNECT_API_KEY" ] && missing+=(APP_STORE_CONNECT_API_KEY)
          [ -z "$APPLE_TEAM_ID" ] && missing+=(APPLE_TEAM_ID)
          [ -z "$APPLE_DIST_CERT_P12_BASE64" ] && missing+=(APPLE_DIST_CERT_P12_BASE64)
          [ -z "$APPLE_DIST_CERT_P12_PASSWORD" ] && missing+=(APPLE_DIST_CERT_P12_PASSWORD)
          [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ] && missing+=(APPLE_PROVISIONING_PROFILE_BASE64)
          [ -z "$KEYCHAIN_PASSWORD" ] && missing+=(KEYCHAIN_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        uses: ./.github/actions/install-xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Stage App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"
          echo "Staged at $AUTH_KEY_PATH"

      - name: Import Apple Distribution certificate
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/AppleDist.p12"

          echo "$APPLE_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Keep signing material out of the persistent login keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 2h timeout matches the job timeout; auto-locks if we crash.
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_DIST_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow noninteractive codesign access or CI can hang on a prompt.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend this keychain without removing access to system identities.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Identities available for codesigning:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        id: profile
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_TMP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_TMP"

          # Install by UUID and reference by profile name, as Xcode expects.
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_TMP")
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | plutil -extract UUID raw -)
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | plutil -extract Name raw -)

          cp "$PROFILE_TMP" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          rm -f "$PROFILE_TMP"

          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Write Config/Local.xcconfig from secrets
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          # Pass secrets through environment variables, never inline workflow expressions.
          # GitHub evaluates expression delimiters even inside shell comments; invalid examples break queueing.
          # Materialize the ignored signing overrides included by Config/Base.xcconfig.
          mkdir -p Config
          cat > Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          EOF

      - name: Compute build number
        id: build_number
        run: |
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          echo "value=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using build number: $BUILD_NUMBER"

      - name: Write export options
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.brianwang.Super</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          EOF

      - name: Archive
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          set -o pipefail
          # Keep signing target-scoped so profiles do not leak into SwiftPM resource bundles.
          # Public signing mode/identity come from project.yml; private team/profile values come from Local.xcconfig.
          ARGS=(
            -project Super.xcodeproj
            -scheme Super
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath build/Super.xcarchive
            -skipPackagePluginValidation
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          )
          if [ -n "$MARKETING_VERSION" ]; then
            ARGS+=(MARKETING_VERSION="$MARKETING_VERSION")
          fi
          xcodebuild archive "${ARGS[@]}"

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          # Manual signing prevents profile creation; allowProvisioningUpdates still permits upload authentication.
          xcodebuild -exportArchive \
            -archivePath build/Super.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Upload submitted to TestFlight; processing in App Store Connect typically completes in 5-30 minutes."

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "$AUTH_KEY_PATH" || true
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
