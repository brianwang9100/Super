name: iOS Build

on:
  push:
    branches: [main]
  # No path filter on purpose: this workflow's `build` and `ios-test`
  # jobs are required status checks. A path-filtered required check
  # that doesn't fire on a PR shows as "expected but not reported"
  # and blocks merge forever.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Detects whether anything other than docs changed. A docs-only PR then
    # skips the expensive macOS build/test legs, while the required-check
    # gate jobs (`build`, `ios-test`) still run and still report — preserving
    # the "no path filter on the workflow" property the top-of-file comment
    # relies on (we gate the heavy *steps*, never the *checks*). dot: true is
    # on by default in paths-filter@v3, so a change confined to .github/ or
    # another dotfile counts as code and runs the full matrix.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      # Third-party community action pinned to a commit SHA (not a mutable
      # tag) so a tag force-push can't swap the code under us.
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  build-app:
    # One leg per app target. Both build in parallel on their own runners;
    # the shared SPM cache (key includes project.yml so target-shape changes
    # invalidate) means the second leg mostly hits cached checkouts for
    # Core / Chat / Bible. fail-fast: false so a Super-only break doesn't
    # cancel the SuperBible leg (and vice versa). Full rationale:
    # docs/superpowers/specs/2026-05-23-superbible-fork-design.md §5.
    #
    # Job is intentionally NOT named `build` — the matrix publishes
    # per-leg checks (`build-app (Super)`, `build-app (SuperBible)`), and
    # the aggregation gate below is named `build` so it takes over the
    # pre-existing required-check name without a branch-protection edit.
    #
    # Gated on `changes`: a docs-only PR skips these macOS legs entirely;
    # the `build` gate below still reports success in that case.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [Super, SuperBible]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        # Pinned explicitly (not `latest-stable`) so SwiftUI snapshot
        # baselines stay pixel-stable across runs. macos-26's Xcode
        # 26.4.1 ships the iOS 26.4 SDK; the older macos-15 image
        # caps at Xcode 26.3 + iOS 26.2, and iOS 26.2 is no longer
        # downloadable from Apple — which forced this upgrade.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        # Pinned release binary instead of `brew install xcodegen` (avoids the
        # ~30-90s brew formula auto-update per leg). Version + install logic
        # live in the composite action so all call sites stay in lockstep.
        uses: ./.github/actions/install-xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        # Cache key includes project.yml so adding / renaming / removing a
        # target invalidates the SPM cache — a stale cache hiding a real
        # build issue is documented in the SB-M0 fork spec §5.4 as the
        # primary risk of this matrix layout.
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Cache DerivedData build products
        # Speed-only optimization: persist the compiled module cache + build
        # products so the 2nd…Nth run of a branch incrementally recompiles
        # only changed inputs instead of cold-building Core / GRDB / app
        # sources from scratch. Keyed per scheme; the project.yml/Package
        # hash in the key (plus the prefix restore-key) means a target-shape
        # change starts fresh while source-only edits warm-start. A stale
        # cache can never go green on broken code — xcodebuild still compiles
        # every changed input on every run.
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Super-*/Build
          # Xcode version (literal 26.4.1, matching the setup-xcode pin) is in
          # the key so a runner-image Xcode bump with unchanged Package.resolved
          # / project.yml auto-busts the cache instead of restoring DerivedData
          # built by a different toolchain (which causes stale-module failures).
          key: ios-dd-${{ runner.os }}-xc26.4.1-${{ matrix.scheme }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ios-dd-${{ runner.os }}-xc26.4.1-${{ matrix.scheme }}-

      - name: Build (iOS Simulator)
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Super.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  build:
    # Aggregation gate. Branch protection requires a status check named
    # literally `build`; the `build-app` matrix above publishes per-scheme
    # checks (`build-app (Super)`, `build-app (SuperBible)`), so this job
    # re-exports a single stable `build` status that depends on every leg.
    # Same pattern as the `ios-test` gate below. A required check that
    # never reports blocks merge forever — see the note at the top of file.
    needs: [changes, build-app]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all app-build matrix legs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.build-app.result }}
        run: |
          # Fail closed: if the `changes` detector didn't succeed its empty
          # output must NOT be misread as "docs-only" and skip the build.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes-detection job did not succeed — refusing to skip the build."
            exit 1
          fi
          # Docs-only PR: build-app was intentionally skipped, so this
          # required check passes without a build. Any code change must
          # produce a successful build-app.
          if [ "$CODE" != "true" ]; then
            echo "Docs-only change — no app build required."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::One or more build-app matrix legs failed."
            exit 1
          fi
          echo "All build-app matrix legs passed."

  discover:
    # Emits the snapshot-test matrix by globbing for packages that own a
    # `Tests/<Pkg>Tests/UI/Snapshots/` directory, so a new applet's snapshot
    # suites run with zero workflow edits. Globbing the test dirs (not
    # `*.xcscheme`) is deliberate: a package with snapshot tests but no
    # registered scheme then fails its leg loudly rather than vanishing
    # from CI. A GitHub Actions matrix must come from a prior job's output.
    runs-on: ubuntu-latest
    outputs:
      schemes: ${{ steps.find.outputs.schemes }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Packages
      - id: find
        run: |
          set -euo pipefail
          shopt -s nullglob
          schemes=$(for d in Packages/*/Tests/*/UI/Snapshots; do
            [ -d "$d" ] || continue
            echo "$d" | cut -d/ -f2
          done | sort -u | jq -R . | jq -cs .)
          # Fail loud on an empty result: an empty matrix would skip every
          # snapshot leg, and the gate could then read a vacuous success.
          if [ -z "$schemes" ] || [ "$schemes" = "[]" ]; then
            echo "::error::No snapshot-test directories found under Packages/*/Tests/*/UI/Snapshots."
            exit 1
          fi
          echo "Discovered snapshot schemes: $schemes"
          echo "schemes=$schemes" >> "$GITHUB_OUTPUT"

  ios-snapshot-test:
    # Gated on `changes` (like build-app): docs-only PRs skip these macOS
    # legs; the `ios-test` gate below still reports success in that case.
    needs: [changes, discover]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    # One leg per applet scheme. Each leg runs on its own runner, so it
    # builds its dependency graph (Core, GRDB, SnapshotTesting, …) exactly
    # once into a single derived-data path — the old single job recompiled
    # those deps from scratch for every scheme into separate paths, and
    # ran the schemes sequentially. `fail-fast: false` so one scheme's
    # snapshot failure doesn't cancel the others.
    strategy:
      fail-fast: false
      matrix:
        scheme: ${{ fromJSON(needs.discover.outputs.schemes) }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        # Pinned explicitly (not `latest-stable`) so SwiftUI snapshot
        # baselines stay pixel-stable across runs. macos-26's Xcode
        # 26.4.1 ships the iOS 26.4 SDK; the older macos-15 image
        # caps at Xcode 26.3 + iOS 26.2, and iOS 26.2 is no longer
        # downloadable from Apple — which forced this upgrade.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        # Pinned release binary instead of `brew install xcodegen` (avoids the
        # ~30-90s brew formula auto-update per leg). Version + install logic
        # live in the composite action so all call sites stay in lockstep.
        uses: ./.github/actions/install-xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Cache DerivedData build products
        # Speed-only optimization (see the matching step in build-app): the
        # snapshot legs build into -derivedDataPath build/derived, so cache
        # that Build/ tree to incrementally recompile across runs. Keyed per
        # scheme; the Build/ tree excludes Logs/ (xcresults) which are
        # uploaded separately on failure.
        uses: actions/cache@v6
        with:
          path: build/derived/Build
          # Xcode version in the key (see build-app) so a toolchain bump
          # busts the cache rather than restoring stale compiled modules.
          key: ios-dd-snap-${{ runner.os }}-xc26.4.1-${{ matrix.scheme }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ios-dd-snap-${{ runner.os }}-xc26.4.1-${{ matrix.scheme }}-

      - name: Pick iOS simulator
        id: sim
        run: |
          # Pinned literally to "iPhone 17 on iOS 26.4.1 (build 23E254a)" — the
          # device name, the runtime minor, AND the exact runtime build must
          # match between CI and local recording or SwiftUI snapshot baselines
          # drift (different screen size, safe-area insets, text-renderer
          # build). A -destination can only express the minor (OS=26.4), so the
          # build is asserted separately below: 23E244 (26.4.0) and 23E254a
          # (26.4.1) both report as "iOS 26.4" yet render differently. When
          # repinning, update this script (incl. RUNTIME_BUILD), the AGENTS.md
          # trio (§ "iOS testing"), and re-record every baseline under
          # Packages/*/Tests/.../__Snapshots__.
          #
          # Source of truth: the local PreToolUse guard
          # (.codex/hooks/enforce-snapshot-sim.py) reads the pin straight from
          # this file — the `RUNTIME_BUILD="..."` literal, the `--json "iOS
          # <ver>"` literal, the `name")=="iPhone <n>"` literal, and the
          # `xcode-version:` inputs. Keep those four shapes intact when editing,
          # or the guard falls back to its hardcoded last-known pin.
          RUNTIME_BUILD="23E254a"
          # Assert the runner's iOS 26.4 runtime is exactly the pinned build:
          # there must be exactly one installed iOS 26.4.x runtime and its build
          # must be $RUNTIME_BUILD. simctl can't express a build in a
          # -destination, and it conflates 26.4.0 + 26.4.1 under one identifier
          # (iOS-26-4), so a runner image that swaps the bundled 26.4 build —
          # or installs both — would silently re-render every baseline. Fail
          # loud here instead.
          BUILD=$(xcrun simctl list runtimes --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); \
                r=[x for x in d["runtimes"] if "SimRuntime.iOS-26-4" in x.get("identifier","") and x.get("isAvailable")]; \
                print(r[0]["buildversion"] if len(r)==1 else ("NONE" if not r else "MULTIPLE"))')
          if [ "$BUILD" != "$RUNTIME_BUILD" ]; then
            echo "::error::Expected exactly one iOS 26.4.x runtime at build $RUNTIME_BUILD on this runner, got: $BUILD."
            xcrun simctl list runtimes iOS
            echo "::error::Snapshot baselines are pixel-locked to $RUNTIME_BUILD. Install it with 'sudo xcodebuild -downloadPlatform iOS -buildVersion $RUNTIME_BUILD' (and remove any other 26.4.x build), or repin + re-record."
            exit 1
          fi
          DEVICE=$(xcrun simctl list devices --json "iOS 26.4" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); \
                target=next((d for r in data["devices"] for d in data["devices"][r] if d.get("name")=="iPhone 17"), None); \
                print(target["udid"] if target else "")')
          if [ -z "$DEVICE" ]; then
            echo "::error::iPhone 17 on iOS 26.4 not found on this runner."
            xcrun simctl list devices --json "iOS 26.4"
            exit 1
          fi
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE (iPhone 17 / iOS 26.4.1 / $RUNTIME_BUILD)"

      - name: Boot iOS simulator
        # Boot the simulator now so it's warm before `xcodebuild test`.
        # Otherwise the lazy first boot lands inside the timed testing
        # phase. `bootstatus -b` blocks until the device is fully booted
        # (returns immediately if it already is).
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Run snapshot tests on iOS Simulator
        # The simulator runs only SwiftUI snapshot suites — pure-logic unit
        # tests already run on macOS in the Swift Tests workflow, so running
        # them here too is duplicated work. GRDB schema snapshots live
        # outside UI/Snapshots/ (no UIKit guard) and stay in `swift test`.
        #
        # The `@Suite` type name is read from each file's source (the struct
        # that follows the `@Suite` attribute) rather than inferred from the
        # filename: a struct whose name diverges from its filename would
        # otherwise yield an `-only-testing:` arg matching zero tests, and
        # xcodebuild would still exit 0 — silently dropping that suite.
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -o pipefail
          DIR="Packages/$SCHEME/Tests/${SCHEME}Tests/UI/Snapshots"
          ONLY_TESTING=()
          for f in "$DIR"/*SnapshotTests.swift; do
            [ -e "$f" ] || continue
            while IFS= read -r suite; do
              ONLY_TESTING+=( "-only-testing:${SCHEME}Tests/$suite" )
            done < <(awk '/@Suite/{f=1} f && /^struct /{print $2; f=0}' "$f")
          done
          if [ ${#ONLY_TESTING[@]} -eq 0 ]; then
            echo "::error::No @Suite snapshot tests found under $DIR"
            exit 1
          fi
          echo "Snapshot suites for $SCHEME: ${ONLY_TESTING[*]}"
          xcodebuild test \
            -project Super.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -derivedDataPath build/derived \
            "${ONLY_TESTING[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult bundle on failure
        # Snapshot diffs (reference.png / failure.png / difference.png)
        # land as test attachments inside the .xcresult. Uploading the
        # bundle on failure lets a contributor pull it down and inspect
        # the pixel diff that CI saw, rather than re-recording blind.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-xcresult-${{ matrix.scheme }}
          path: build/derived/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          PROFDATA=$(find build/derived -name 'Coverage.profdata' -type f | head -1)
          BINARY=$(find build/derived -name "${SCHEME}Tests" -type f -path "*${SCHEME}Tests.xctest*" | head -1)
          if [ -z "$PROFDATA" ] || [ -z "$BINARY" ]; then
            echo "Coverage artifacts not found — skipping summary."
            exit 0
          fi
          xcrun llvm-cov report "$BINARY" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex='\.build/|/Tests/|/SourcePackages/' \
            | tail -50

  ios-test:
    # Aggregation gate. Branch protection requires a status check named
    # literally `ios-test`; the matrix job above publishes per-scheme checks
    # (`ios-snapshot-test (Chat)` …), so this job re-exports a single stable
    # `ios-test` status that depends on every leg. A required check that
    # never reports blocks merge forever — see the note at the top of file.
    needs: [changes, discover, ios-snapshot-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify discovery and all snapshot test legs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          RESULT: ${{ needs.ios-snapshot-test.result }}
        run: |
          # Fail closed if the `changes` detector didn't succeed (see the
          # build gate for rationale).
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes-detection job did not succeed — refusing to skip snapshot tests."
            exit 1
          fi
          # `discover` runs on every PR (incl. docs-only) and is ubuntu-cheap.
          # Check it BEFORE the docs-only early-exit so a broken discovery
          # script (e.g. after a directory restructure) blocks merge promptly
          # instead of hiding until the next code-change PR, where it would be
          # misattributed. A failed discover means the snapshot matrix is
          # skipped, and an empty/skipped matrix must not read as success.
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::Snapshot-scheme discovery failed — no snapshot tests ran."
            exit 1
          fi
          # Docs-only PR: snapshot legs were intentionally skipped, so this
          # required check passes without running them.
          if [ "$CODE" != "true" ]; then
            echo "Docs-only change — no snapshot tests required."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::One or more ios-snapshot-test matrix legs failed."
            exit 1
          fi
          echo "All ios-snapshot-test matrix legs passed."
