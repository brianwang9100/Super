name: iOS Build

on:
  push:
    branches: [main]
  # No path filter on purpose: this workflow's `build` and `ios-test`
  # jobs are required status checks. A path-filtered required check
  # that doesn't fire on a PR shows as "expected but not reported"
  # and blocks merge forever.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # Pinned explicitly (not `latest-stable`) so SwiftUI snapshot
        # baselines stay pixel-stable across runs. macos-26's Xcode
        # 26.4.1 ships the iOS 26.4 SDK; the older macos-15 image
        # caps at Xcode 26.3 + iOS 26.2, and iOS 26.2 is no longer
        # downloadable from Apple — which forced this upgrade.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Super.xcodeproj \
            -scheme Super \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  ios-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # Pinned explicitly (not `latest-stable`) so SwiftUI snapshot
        # baselines stay pixel-stable across runs. macos-26's Xcode
        # 26.4.1 ships the iOS 26.4 SDK; the older macos-15 image
        # caps at Xcode 26.3 + iOS 26.2, and iOS 26.2 is no longer
        # downloadable from Apple — which forced this upgrade.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Pick iOS simulator
        id: sim
        run: |
          # Pinned literally to "iPhone 17 on iOS 26.4" — both the device
          # name and the runtime must match between CI and local recording
          # or SwiftUI snapshot baselines drift (different screen size,
          # safe-area insets, text-renderer build). When repinning, update
          # this script, the AGENTS.md trio (§ "iOS testing"), and re-record
          # every baseline under Packages/Chat/Tests/.../__Snapshots__.
          DEVICE=$(xcrun simctl list devices --json "iOS 26.4" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); \
                target=next((d for r in data["devices"] for d in data["devices"][r] if d.get("name")=="iPhone 17"), None); \
                print(target["udid"] if target else "")')
          if [ -z "$DEVICE" ]; then
            echo "::error::iPhone 17 on iOS 26.4 not found on this runner."
            xcrun simctl list devices --json "iOS 26.4"
            exit 1
          fi
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE (iPhone 17 / iOS 26.4)"

      - name: Run Chat snapshot + unit tests on iOS Simulator
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Super.xcodeproj \
            -scheme Chat \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult bundle on failure
        # Snapshot diffs (reference.png / failure.png / difference.png)
        # land as test attachments inside the .xcresult. Uploading the
        # bundle on failure lets a contributor pull it down and inspect
        # the pixel diff that CI saw, rather than re-recording blind.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-xcresult
          path: build/derived/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          PROFDATA=$(find build/derived -name 'Coverage.profdata' -type f | head -1)
          BINARY=$(find build/derived -name 'ChatTests' -type f -path '*ChatTests.xctest*' | head -1)
          if [ -z "$PROFDATA" ] || [ -z "$BINARY" ]; then
            echo "Coverage artifacts not found — skipping summary."
            exit 0
          fi
          xcrun llvm-cov report "$BINARY" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex='\.build/|/Tests/|/SourcePackages/' \
            | tail -50
