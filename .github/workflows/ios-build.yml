name: iOS Build

on:
  push:
    branches: [main]
  # No path filter on purpose: this workflow's `build` and `ios-test`
  # jobs are required status checks. A path-filtered required check
  # that doesn't fire on a PR shows as "expected but not reported"
  # and blocks merge forever.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26+
        # macos-15 image's default Xcode is 16.4 (iOS 18.5 SDK). The repo
        # targets Swift 6 strict-concurrency rules that newer toolchains
        # enforce more rigorously, and snapshot baselines are recorded
        # against iOS 26.x simulators. Pin to latest-stable Xcode so the
        # runner uses the same toolchain + sim runtime as local dev.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Super.xcodeproj \
            -scheme Super \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  ios-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26+
        # macos-15 image's default Xcode is 16.4 (iOS 18.5 SDK). The repo
        # targets Swift 6 strict-concurrency rules that newer toolchains
        # enforce more rigorously, and snapshot baselines are recorded
        # against iOS 26.x simulators. Pin to latest-stable Xcode so the
        # runner uses the same toolchain + sim runtime as local dev.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Install latest iOS simulator runtime
        # Pin the simulator runtime so snapshot baselines (recorded locally
        # against the latest iOS simulator) compare against the same
        # renderer here. Without this, the runner falls back to the iOS
        # 26.2 SDK that ships with Xcode 26.3, and the small sub-pixel
        # differences in custom-font rendering (e.g. the Instrument Serif
        # greeting in ChatEmptyState) blow up exact-pixel snapshot
        # comparisons. `-downloadPlatform iOS` without `-buildVersion`
        # downloads the latest compatible runtime for the selected Xcode.
        # Simulator runtimes are installed under
        # `/Library/Developer/CoreSimulator/...` which is root-owned and
        # outside the cacheable workspace, so we can't usefully cache it
        # across runs — the timeout is the safety net instead.
        timeout-minutes: 20
        run: xcodebuild -downloadPlatform iOS

      - name: Pick iOS simulator
        id: sim
        run: |
          # Show what's installed for debugging.
          xcrun simctl list runtimes
          # Resolve the highest-version available iOS runtime identifier
          # so snapshot baselines compare against the same renderer used
          # at recording time. Then find — or create — an iPhone device
          # on that runtime. We deliberately pin to the *latest* runtime
          # (not the runner's pre-installed one) because pre-installed
          # runtimes lag actual local-dev environments, and exact-pixel
          # snapshot tests are sub-pixel sensitive across iOS minor
          # versions.
          RUNTIME=$(xcrun simctl list runtimes --json \
            | python3 -c 'import json,sys; rts=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name","")]; rts.sort(key=lambda r: tuple(int(p) for p in r["version"].split(".")), reverse=True); print(rts[0]["identifier"] if rts else "")')
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS simulator runtime available on this runner."
            exit 1
          fi
          echo "Using runtime $RUNTIME"
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print(next((d['udid'] for d in data['devices'].get('$RUNTIME',[]) if 'iPhone' in d.get('name','')), ''))")
          if [ -z "$DEVICE" ]; then
            # Runtime exists but no default iPhone device — create one
            # using whatever modern iPhone device-type the runner has.
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json \
              | python3 -c 'import json,sys; types=[t for t in json.load(sys.stdin)["devicetypes"] if "iPhone" in t.get("name","") and "Pro" in t.get("name","") and "Max" not in t.get("name","")]; types.sort(key=lambda t: t["name"], reverse=True); print(types[0]["identifier"] if types else "")')
            if [ -z "$DEVICE_TYPE" ]; then
              echo "::error::No iPhone Pro device type available."
              exit 1
            fi
            echo "Creating simulator on $DEVICE_TYPE"
            DEVICE=$(xcrun simctl create "iPhone-CI" "$DEVICE_TYPE" "$RUNTIME")
          fi
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE"

      - name: Run Chat snapshot + unit tests on iOS Simulator
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Super.xcodeproj \
            -scheme Chat \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage summary
        if: always()
        run: |
          PROFDATA=$(find build/derived -name 'Coverage.profdata' -type f | head -1)
          BINARY=$(find build/derived -name 'ChatTests' -type f -path '*ChatTests.xctest*' | head -1)
          if [ -z "$PROFDATA" ] || [ -z "$BINARY" ]; then
            echo "Coverage artifacts not found — skipping summary."
            exit 0
          fi
          xcrun llvm-cov report "$BINARY" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex='\.build/|/Tests/|/SourcePackages/' \
            | tail -50
