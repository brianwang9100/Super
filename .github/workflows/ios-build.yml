name: iOS Build

on:
  push:
    branches: [main]
  # No path filter on purpose: this workflow's `build` and `ios-test`
  # jobs are required status checks. A path-filtered required check
  # that doesn't fire on a PR shows as "expected but not reported"
  # and blocks merge forever.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26+
        # macos-15 image's default Xcode is 16.4 (iOS 18.5 SDK). The repo
        # targets Swift 6 strict-concurrency rules that newer toolchains
        # enforce more rigorously, and snapshot baselines are recorded
        # against iOS 26.x simulators. Pin to latest-stable Xcode so the
        # runner uses the same toolchain + sim runtime as local dev.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Super.xcodeproj \
            -scheme Super \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  ios-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26+
        # macos-15 image's default Xcode is 16.4 (iOS 18.5 SDK). The repo
        # targets Swift 6 strict-concurrency rules that newer toolchains
        # enforce more rigorously, and snapshot baselines are recorded
        # against iOS 26.x simulators. Pin to latest-stable Xcode so the
        # runner uses the same toolchain + sim runtime as local dev.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Install latest iOS simulator runtime
        # Snapshot rendering output is driven by the iOS *simulator
        # runtime* — not the Xcode SDK — so the runtime version pinned
        # in CI must match the runtime used to record baselines locally.
        # The macOS-15 runner image ships Xcode 26.3 with iOS 26.2 SDK
        # + iOS 26.2 sim runtime preinstalled, but Apple no longer
        # distributes iOS 26.2 runtime to local installs (only the
        # latest minor, iOS 26.3.1, is downloadable). Downloading the
        # latest runtime here aligns CI rendering with `xcodebuild
        # -downloadPlatform iOS` on a fresh local Xcode 26.3 install.
        run: |
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes | grep iOS

      - name: Pick iOS simulator
        id: sim
        run: |
          # Look at the highest-version iOS runtime *only*, so that an
          # older pre-bundled runtime can never win when the newer one
          # has no devices auto-created yet (which is the usual state
          # right after `xcodebuild -downloadPlatform iOS`). If the top
          # runtime has no iPhone device, create one explicitly.
          TOP_RUNTIME=$(xcrun simctl list runtimes --json \
            | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name","")]; rs.sort(key=lambda r: tuple(int(p) for p in r["version"].split(".")), reverse=True); print(rs[0]["identifier"])')
          export TOP_RUNTIME
          echo "Top iOS runtime: $TOP_RUNTIME"
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys,os; data=json.load(sys.stdin); rt=os.environ['TOP_RUNTIME']; ds=[d for d in data['devices'].get(rt, []) if 'iPhone' in d.get('name','')]; print(ds[0]['udid'] if ds else '')")
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl create "iPhone17Pro-Snapshot" "iPhone 17 Pro" "$TOP_RUNTIME")
          fi
          if [ -z "$DEVICE" ]; then
            echo "::error::No iPhone simulator available on this runner."
            exit 1
          fi
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE (runtime $TOP_RUNTIME)"
          xcrun simctl list devices | grep "$DEVICE" || true

      - name: Run Chat snapshot + unit tests on iOS Simulator
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Super.xcodeproj \
            -scheme Chat \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage summary
        if: always()
        run: |
          PROFDATA=$(find build/derived -name 'Coverage.profdata' -type f | head -1)
          BINARY=$(find build/derived -name 'ChatTests' -type f -path '*ChatTests.xctest*' | head -1)
          if [ -z "$PROFDATA" ] || [ -z "$BINARY" ]; then
            echo "Coverage artifacts not found — skipping summary."
            exit 0
          fi
          xcrun llvm-cov report "$BINARY" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex='\.build/|/Tests/|/SourcePackages/' \
            | tail -50
