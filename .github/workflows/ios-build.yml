name: iOS Build

on:
  push:
    branches: [main]
  # Required checks must report on every PR; a workflow-level path filter can block merging.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Skip expensive jobs for docs-only changes while still reporting the required gate.
    # Dotfiles must count as code changes.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      # Keep this third-party action pinned to an immutable commit for supply-chain safety.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  build-app:
    # Keep the matrix separate from the stable required `build` gate below.
    # A failed target must not cancel the other target's build.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: [Super, SuperBible]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        # Pin Xcode so runner-image updates cannot change the snapshot renderer.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        uses: ./.github/actions/install-xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        # Include project.yml so target-graph changes invalidate dependency caches.
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Super-*/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Cache DerivedData build products
        # Reuse per-scheme build products; xcodebuild still recompiles changed inputs.
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Super-*/Build
          # Include the pinned toolchain version to prevent stale-module failures across Xcode updates.
          key: ios-dd-${{ runner.os }}-xc26.4.1-${{ matrix.scheme }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ios-dd-${{ runner.os }}-xc26.4.1-${{ matrix.scheme }}-

      - name: Build (iOS Simulator)
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Super.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  build:
    # Keep the required `build` check stable across changes to the target matrix.
    needs: [changes, build-app]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all app-build matrix legs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.build-app.result }}
        run: |
          # Fail closed if change detection failed; empty output is not proof of a docs-only PR.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes-detection job did not succeed — refusing to skip the build."
            exit 1
          fi
          # Docs-only builds may be skipped; code changes require a successful matrix.
          if [ "$CODE" != "true" ]; then
            echo "Docs-only change — no app build required."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::One or more build-app matrix legs failed."
            exit 1
          fi
          echo "All build-app matrix legs passed."
