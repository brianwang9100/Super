included:
  - App
  - Packages/Core/Sources
  - Packages/Core/Tests
  - Packages/Chat/Sources
  - Packages/Chat/Tests

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"
  - Super.xcodeproj
  - Scripts/ChatLiveLLM/.build
  - "**/__Snapshots__"
  - "**/Snapshots"

disabled_rules:
  - todo
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - identifier_name
  - type_name
  - large_tuple
  - multiple_closures_with_trailing_closure
  - opening_brace
  # Formatting rules disabled because the codebase deliberately
  # column-aligns dictionary literals, theme tables, and math
  # expressions for readability. Re-enable per-file with
  # // swiftlint:disable: blocks if you want them on by default.
  - colon
  - comma
  - operator_usage_whitespace

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_range_nil_comparison
  - flatmap_over_map_reduce
  - reduce_into
  - sorted_first_last
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - closure_end_indentation
  - closure_spacing
  - vertical_whitespace_closing_braces
  - yoda_condition
  - toggle_bool
  - prefer_self_type_over_type_of_self

custom_rules:
  # Brand typography contract: every font resolves through SuperTypography
  # (`typography.display/font/mono`), never a hand-written `.font(.system…)`,
  # `.font(.custom…)`, or bare `Font.system/.custom`. Routing through the one
  # owner keeps the brand-face swap and the font-scale axes centralized — a
  # raw `.system`/`.custom` call silently opts out of both. See the Typography
  # section in AGENTS.md and `Packages/Core/.../Theme/SuperTypography.swift`.
  #
  # The regex requires `.font(` to be *immediately* followed by `.system`/
  # `.custom`, so the legitimate `typography.font(size:)` accessor never trips
  # it. `match_kinds` keeps the match to real code (doc-comment mentions of the
  # banned forms don't false-positive). `excluded` exempts the sole sanctioned
  # caller — SuperTypography itself — plus the test targets, whose snapshot
  # reference grids are fixtures, not product surfaces.
  super_typography_only:
    name: "Use SuperTypography"
    regex: '\.font\(\s*\.(system|custom)|\bFont\s*\.\s*(system|custom)|\bFont\(\s*\.system'
    match_kinds:
      - identifier
      - keyword
    message: "Route fonts through SuperTypography (@Environment(\\.superTypography) → typography.display/font/mono). Raw .font(.system…), .font(.custom…), and Font.system/.custom are banned everywhere except SuperTypography.swift."
    severity: error
    excluded:
      - ".*/Theme/SuperTypography\\.swift"
      - ".*/Tests/.*"

analyzer_rules:
  - unused_import

force_cast: warning
force_try: warning

trailing_comma:
  mandatory_comma: true

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

reporter: "github-actions-logging"
